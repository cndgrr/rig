name: labels
# The automation LABELS.md promises, now implemented upstream
# (heavy-duty/ceremony#13): scope labeling and the state reconciler live in
# the reusable workflow this caller pins. Rig keeps the triggers and
# permissions (a called workflow cannot define them), its path map in
# .github/labeler.yml, and its panel + scope taxonomy in .github/labels.conf.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled, review_requested, review_request_removed]
  issues:
    types: [opened, closed, edited, reopened]
permissions:
  contents: read
  checks: read
  statuses: read
  actions: write
  issues: write
  pull-requests: write
jobs:
  labels:
    uses: heavy-duty/ceremony/.github/workflows/labels.yml@0.7.7
